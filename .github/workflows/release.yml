name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, format: v1.0.0. Leave empty for auto semantic versioning"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --prune --tags

      - name: Calculate semantic version
        id: semver
        if: github.event_name == 'push'
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          fallbackTag: "0.0.0"
          noVersionBumpBehavior: silent
          skipInvalidTags: true

      - name: Set version for manual dispatch
        id: manual_version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "No version specified for manual dispatch"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if release is needed
        id: check
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ steps.semver.outputs.next }}" ]; then
            echo "No conventional commits found - skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version to release: ${{ steps.semver.outputs.next }}"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ steps.manual_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "skip=${{ steps.manual_version.outputs.skip }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.semver.outputs.next }}" >> $GITHUB_OUTPUT
            echo "skip=${{ steps.check.outputs.skip }}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    if: needs.version.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          # Linux + Windows are pure-Go and cross-compiled on Linux.
          - os: ubuntu-latest
            target: linux-windows
          # macOS must build on a macOS host with CGO enabled so gopsutil can
          # read per-core CPU stats (host_processor_info). The macOS runner is
          # arm64 and its clang/SDK can also target amd64, so a single runner
          # produces both darwin binaries.
          - os: macos-latest
            target: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries (${{ matrix.target }})
        run: ./scripts/build.sh ${{ matrix.target }}
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: sysmon-*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/sysmon-linux-amd64
            dist/sysmon-linux-arm64
            dist/sysmon-darwin-amd64
            dist/sysmon-darwin-arm64
            dist/sysmon-windows-amd64.exe
            dist/sysmon-windows-arm64.exe
            README.md
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
